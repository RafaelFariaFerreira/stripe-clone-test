packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  '@parcel/watcher': false
  lmdb: false
  msgpackr-extract: false
  sharp: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.13'
  - '@turbo/darwin-arm64@2.11.13'
  - '@turbo/linux-64@2.11.13'
  - '@turbo/linux-arm64@2.11.13'
  - '@turbo/windows-64@2.11.13'
  - '@turbo/windows-arm64@2.11.13'
  - '@vitest/mocker@5.1.1'
  - '@vitest/spy@5.1.1'
  - turbo@2.11.13
  - vitest@5.1.1
  - '@angular/cdk@22.3.0'
